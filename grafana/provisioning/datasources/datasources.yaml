apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        # Correlación Prometheus exemplar → Jaeger trace
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: "Ver traza en Jaeger"

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    jsonData:
      # Traza → logs: abre en Loki los logs del mismo trace_id (structured metadata)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift:   "5m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      # Log → traza: el trace_id (structured metadata OTLP) se vuelve link a Jaeger
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver traza en Jaeger"

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: "service.name", value: "service_name" }]
        queries:
          - name: "Request rate"
            query: "sum(rate(otelcol_http_requests_total{$$__tags}[5m]))"
      nodeGraph:
        enabled: true
