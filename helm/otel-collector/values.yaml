mode: DaemonSet

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.103.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: otel-collector-sa
  annotations:
    iam.gke.io/gcp-service-account: otel-collector-sa@banded-water-506101-p8.iam.gserviceaccount.com

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 500Mi

service:
  type: ClusterIP
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    metricsInternal: 8888
    metricsProm: 8889
    health: 13133

environment:
  ENVIRONMENT: production
  CLOUD_REGION: us-central1
  GCP_PROJECT_ID: banded-water-506101-p8
