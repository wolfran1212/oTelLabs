apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 15s
              static_configs:
                - targets: ["0.0.0.0:8888"]

    processors:
      memory_limiter:
        check_interval: 0.5s
        limit_mib: 400
        spike_limit_mib: 100

      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048

      resource:
        attributes:
          - action: insert
            key: deployment.environment
            value: "${env:ENVIRONMENT}"
          - action: insert
            key: cloud.region
            value: "${env:CLOUD_REGION}"

      filter/health:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.target"] == "/health"'

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otelcol
        send_timestamps: true

      googlecloud:
        project: "${env:GCP_PROJECT_ID}"
        log:
          default_log_name: "otel-lab"
        trace:
          endpoint: cloudtrace.googleapis.com

      logging:
        verbosity: normal

    service:
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, filter/health, batch]
          exporters: [googlecloud, logging]

        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, logging]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, logging]
