global:
  environment: production
  cloudProvider: gcp
  otelCollectorEndpoint: "http://otel-collector:4317"

postgres:
  image: postgres:16-alpine
  database: appdb
  user: app
  password: secret
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceA:
  replicaCount: 2
  image:
    repository: gcr.io/banded-water-506101-p8/service-a
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8000
  resources:
    requests:
      cpu: 150m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

serviceB:
  replicaCount: 2
  image:
    repository: gcr.io/banded-water-506101-p8/service-b
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 150m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
