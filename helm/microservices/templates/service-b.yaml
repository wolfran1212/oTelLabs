apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: {{ .Release.Namespace }}
  labels:
    app: service-b
spec:
  replicas: {{ .Values.serviceB.replicaCount }}
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: "{{ .Values.serviceB.image.repository }}:{{ .Values.serviceB.image.tag }}"
          imagePullPolicy: {{ .Values.serviceB.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.serviceB.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "microservices.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.serviceB.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.serviceB.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.serviceB.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: {{ .Release.Namespace }}
  labels:
    app: service-b
spec:
  type: {{ .Values.serviceB.service.type }}
  ports:
    - port: {{ .Values.serviceB.service.port }}
      targetPort: {{ .Values.serviceB.service.port }}
      protocol: TCP
      name: http
  selector:
    app: service-b
